[build]
  # Directory to change to before starting a build
  base = "."
  
  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "dist"
  
  # Explicit install + build: ensures devDeps (vite, typescript, tailwind) are always installed
  command = "npm install --include=dev && npm run build"

[build.environment]
  # Node.js LTS version
  NODE_VERSION = "20"
  # Force npm to install ALL dependencies including devDependencies
  # Required because Netlify sets NODE_ENV=production which can prune devDeps
  NPM_FLAGS = "--include=dev"
  # Prevent CI mode from treating warnings as build errors
  CI = ""

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Environment variables (these should be set in Netlify dashboard)
# VITE_SUPABASE_URL
# VITE_SUPABASE_ANON_KEY
# VITE_SUPABASE_SERVICE_ROLE_KEY